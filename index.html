<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課程出席確認與資源門戶</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --success-color: #16a34a;
      --danger-color: #dc2626;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --subtext-color: #64748b;
      --border-color: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.5;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 24px;
      margin-top: 10px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .header h1 {
      font-size: 1.35rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 0.875rem;
      color: var(--subtext-color);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #334155;
    }

    select, input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      background-color: #fff;
      color: var(--text-color);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }

    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: "▼";
      font-size: 0.75rem;
      color: var(--subtext-color);
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    select:disabled {
      background-color: #f1f5f9;
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* 飲食區塊 */
    .diet-box {
      background-color: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
      display: none;
    }

    .diet-info {
      font-size: 0.9rem;
      color: #0369a1;
      margin-bottom: 8px;
    }

    .diet-info strong {
      color: #0c4a6e;
    }

    .modify-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #334155;
      cursor: pointer;
      margin-top: 6px;
    }

    .modify-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary-color);
    }

    .custom-diet-input {
      margin-top: 10px;
      display: none;
    }

    /* 按鈕區 */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-attend {
      background-color: var(--success-color);
      color: white;
    }

    .btn-attend:hover {
      background-color: #15803d;
    }

    .btn-absent {
      background-color: #fef2f2;
      color: var(--danger-color);
      border: 1.5px solid #fecaca;
    }

    .btn-absent:hover {
      background-color: #fee2e2;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 資源區塊 */
    .resources-section {
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px dashed var(--border-color);
